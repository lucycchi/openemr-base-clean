# GitLab CI/CD for this fork.
#
# One stage, check, on every push and every merge request:
#
#   eval-gate    the Clinical Co-Pilot eval gate, the same one the pre-push
#                hook runs (tests/evals/gate.sh): sidecar pytest, the module's
#                isolated PHPUnit, the case index, and the deterministic golden
#                cases against the committed baseline. It brings up a throwaway
#                OpenEMR stack from the commit under test (tests/evals/ci-gate.sh)
#                and fails the pipeline on any regression. With "Pipelines must
#                succeed" on in the project's merge request settings, a failed
#                evaluation blocks the merge.
#   php-lint     php -l over the module and the eval harness.
#   compose-lint the VPS compose file parses.
#
# Runner: a project runner with the shell executor and the tag copilot-eval,
# on a Linux host with Docker (the jobs call docker directly; the eval gate
# bind-mounts the checkout into its stack, which the docker executor cannot
# do without docker-in-docker). It takes up to three jobs at once, and the
# eval-gate job's resource_group keeps the eval stack to one at a time.
#
# Who can start a pipeline: on labs.gauntletai.com a student's personal account
# cannot (403), but a project access token's bot user can. Pipelines are started
# with that token (GITLAB_CI_BOT_TOKEN in .env), e.g.
#   curl -X POST -H "PRIVATE-TOKEN: $GITLAB_CI_BOT_TOKEN" \
#     https://labs.gauntletai.com/api/v4/projects/1993/pipeline?ref=pdf_reader
#
# Deploys are not a pipeline job: they run from a workstation with
# docker/vps/deploy.sh (see docker/vps/README.md), which rebuilds the sidecar
# image and recreates the stack on the droplet.

stages:
  - check

variables:
  MODULE_DIR: interface/modules/custom_modules/oe-module-clinical-copilot
  GIT_DEPTH: "1"

# One pipeline per change: merge request pipelines for branches with an open
# merge request, branch pipelines otherwise.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  tags:
    - copilot-eval

eval-gate:
  stage: check
  timeout: 50m
  # One eval stack at a time across all pipelines: two would collide on the
  # copilot-ci compose project and double the load on the droplet. The runner
  # itself takes several jobs at once so the lint jobs never queue behind it.
  resource_group: copilot-ci-stack
  variables:
    COPILOT_CI_PROJECT: copilot-ci
  script:
    - tests/evals/ci-gate.sh

php-lint:
  stage: check
  script:
    - |
      docker run --rm -v "$CI_PROJECT_DIR:/app:ro" -w /app -e MODULE_DIR php:8.2-cli-alpine sh -c '
        set -e
        fail=0
        for f in $(find "$MODULE_DIR" tests/evals -name "*.php"); do
          php -l "$f" > /dev/null || fail=1
        done
        test "$fail" = 0
        php -r "json_decode(file_get_contents(getenv(\"MODULE_DIR\").\"/composer.json\"), false, 512, JSON_THROW_ON_ERROR);"
      '

compose-lint:
  stage: check
  variables:
    MYSQL_ROOT_PASSWORD: x
    MYSQL_PASS: x
    OE_PASS: x
    DOMAIN: example.invalid
    FLEX_REPOSITORY: https://example.invalid/openemr.git
  script:
    - docker compose -f docker/vps/docker-compose.yml config --quiet
